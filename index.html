<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limitless Spectrum</title>
    <link rel="stylesheet" href="assets/css/common.css">
    <link rel="stylesheet" href="assets/css/home.css">
</head>

<body>
<!-- 헤더영역-->
    <div id="header"></div>

    <script>
        fetch("header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
            });
    </script>

<main>
    <section class="hero">

        <div class="cat-container">

            <div class="cat-wrapper">
                <img
                    src="assets/image/home/cat_portfolio_idle.png"
                    alt="Portfolio cat"
                    class="cat-image cat-idle"
                >

                <img
                    src="assets/image/home/cat_portfolio_run.gif"
                    alt="Portfolio cat"
                    class="cat-image cat-run"
                >
            </div>

        </div>

    </section>
</main>

</body>

</html>

<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Limitless Spectrum</title>

    <link rel="stylesheet" href="assets/css/common.css">
    <link rel="stylesheet" href="assets/css/home.css">

</head>

<body>

    <!-- 헤더 영역 -->
    <div id="header"></div>

    <script>

        fetch("header.html")
            .then(response => response.text())
            .then(data => {

                document.getElementById("header").innerHTML = data;

                const header = document.querySelector("header");

                if (header) {

                    /*
                     * header.html은 About 페이지 기준으로
                     * ../assets/... 경로를 사용하고 있음.
                     *
                     * 메인 페이지에서는 ../를 제거해야 함.
                     */

                    header.querySelectorAll("img").forEach(img => {

                        const src = img.getAttribute("src");

                        if (src && src.startsWith("../")) {
                            img.src = src.substring(3);
                        }

                    });


                    /* 로고 */

                    header.querySelector(".logo").href = "index.html";


                    /* 데스크톱 네비게이션 */

                    header.querySelectorAll(".navigation a").forEach(link => {

                        const text = link.querySelector(".nav-text").textContent;

                        if (text === "About") {
                            link.href = "pages/about.html";
                        }

                        if (text === "Work") {
                            link.href = "pages/work.html";
                        }

                        if (text === "Archive") {
                            link.href = "pages/archive.html";
                        }

                    });


                    /* 모바일 네비게이션 */

                    header.querySelectorAll(".mobile-menu a").forEach(link => {

                        const text = link.textContent;

                        if (text === "About") {
                            link.href = "pages/about.html";
                        }

                        if (text === "Work") {
                            link.href = "pages/work.html";
                        }

                        if (text === "Archive") {
                            link.href = "pages/archive.html";
                        }

                    });


                    /* 햄버거 메뉴 */

                    const menuButton = header.querySelector(".menu-toggle");

                    if (menuButton) {

                        menuButton.addEventListener("click", () => {
                            header.classList.toggle("menu-open");
                        });

                    }

                }

            });

    </script>


    <main>

        <section class="hero">

            <div class="cat-container">

               <a href="pages/work.html" class="cat-wrapper">
    <img class="cat-image cat-idle" src="assets/image/home/cat_portfolio_idle.png" alt="Portfolio">
    <img class="cat-image cat-run" src="assets/image/home/cat_portfolio_run.gif" alt="Portfolio">
</a>

                <div class="hero-text">

                    <h1>KIM YOU JIN | PORTFOLIO</h1>

                    <p>
                        콘텐츠 기획부터 비주얼 디자인까지 가능한 디자이너
                    </p>

                </div>

            </div>

        </section>

    </main>

</body>

</html>

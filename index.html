<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Limitless Spectrum</title>

    <link rel="stylesheet" href="assets/css/common.css">
    <link rel="stylesheet" href="assets/css/home.css">
</head>

<body>

    <!-- 헤더 영역 -->
    <div id="header"></div>

    <script>
        fetch("header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;

                const menuButton = document.querySelector(".menu-toggle");
                const header = document.querySelector("header");

                if (menuButton && header) {
                    menuButton.addEventListener("click", () => {
                        header.classList.toggle("menu-open");
                    });
                }
            });
    </script>


    <main>

        <section class="hero">

            <div class="cat-container">

                <div class="cat-wrapper">

                    <img
                        src="assets/image/home/cat_portfolio_idle.png"
                        alt="Portfolio cat"
                        class="cat-image cat-idle"
                    >

                    <img
                        src="assets/image/home/cat_portfolio_run.gif"
                        alt="Portfolio cat"
                        class="cat-image cat-run"
                    >

                </div>

                <div class="hero-text">
                    <h1>KIM YOU JIN | PORTFOLIO</h1>
                    <p>콘텐츠 기획부터 비주얼 디자인까지 가능한 디자이너</p>
                </div>

            </div>

        </section>

    </main>

</body>

</html>

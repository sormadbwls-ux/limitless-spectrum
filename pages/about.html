<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>About | Limitless Spectrum</title>

    <link rel="stylesheet" href="../assets/css/common.css">

</head>

<body>

    <div id="header"></div>

    <script>

        fetch("../header.html")
            .then(response => response.text())
            .then(data => {

                document.getElementById("header").innerHTML = data;

                const header = document.querySelector("header");

                if (header) {

                    /* About 페이지용 이미지 경로 */

                    header.querySelectorAll("img").forEach(img => {

                        const src = img.getAttribute("src");

                        if (src && src.startsWith("../")) {
                            return;
                        }

                        if (src && src.startsWith("assets/")) {
                            img.src = "../" + src;
                        }

                    });


                    /* 로고 */

                    header.querySelector(".logo").href = "../index.html";


                    /* 데스크톱 네비게이션 */

                    header.querySelectorAll(".navigation a").forEach(link => {

                        const text = link.querySelector(".nav-text").textContent;

                        if (text === "About") {
                            link.href = "about.html";
                        }

                        if (text === "Work") {
                            link.href = "work.html";
                        }

                        if (text === "Archive") {
                            link.href = "archive.html";
                        }

                    });


                    /* 모바일 메뉴 */

                    header.querySelectorAll(".mobile-menu a").forEach(link => {

                        const text = link.textContent;

                        if (text === "About") {
                            link.href = "about.html";
                        }

                        if (text === "Work") {
                            link.href = "work.html";
                        }

                        if (text === "Archive") {
                            link.href = "archive.html";
                        }

                    });


                    /* 햄버거 메뉴 */

                    const menuButton = header.querySelector(".menu-toggle");

                    if (menuButton) {

                        menuButton.addEventListener("click", () => {
                            header.classList.toggle("menu-open");
                        });

                    }

                }

            });

    </script>


    <main>

        <section class="about">

            <div class="about-inner">

                <p class="about-label">ABOUT</p>

                <h1>KIM YOU JIN</h1>

                <p class="about-intro">
                    콘텐츠 기획부터 비주얼 디자인까지<br>
                    다양한 시각으로 이야기를 만들어가는 디자이너입니다.
                </p>

            </div>

        </section>

    </main>

</body>

</html>

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Archive | Limitless Spectrum</title>

    <link rel="stylesheet" href="/assets/css/common.css">
    <link rel="stylesheet" href="/assets/css/archive.css">
</head>

<body>

    <!-- 공통 네비게이션 -->
    <div id="header"></div>


    <main>

        <!-- =====================
             HERO
        ====================== -->

        <section class="archive-hero">

            <h1>ARCHIVE</h1>

        </section>


        <!-- =====================
             ARCHIVE CONTENT
        ====================== -->

        <section class="archive-section" id="year-2026">

            <div class="archive-year-title">
                <h2>2026</h2>
            </div>


            <div class="archive-grid">


                <!-- =====================
                     Shall We Dance?
                ====================== -->

                <article class="archive-card">

                    <button
                        class="archive-card-button"
                        type="button"
                        data-image="/assets/images/archive/full/shall-we-dance.png"
                        data-title="Shall We Dance?"
                        data-type="ILLUSTRATION"
                    >

                        <div class="archive-thumbnail">

                            <img
                                src="/assets/images/archive/thumb/shall-we-dance.jpg"
                                alt="쉘 위 댄스 썸네일"
                            >

                        </div>

                    </button>


                    <div class="archive-card-info">

                        <span>ILLUSTRATION</span>

                        <h3>Shall We Dance?</h3>

                    </div>

                </article>



                <!-- =====================
                     요리조리
                ====================== -->

                <article class="archive-card">

                    <button
                        class="archive-card-button"
                        type="button"
                        data-image="/assets/images/archive/full/yorijori.jpg"
                        data-title="요리조리"
                        data-type="WEB DESIGN"
                        data-description="레시피 정보를 쉽고 직관적으로 탐색할 수 있도록 구성한 웹 홈페이지입니다."
                        data-link="https://sormadbwls-ux.github.io/cook/"
                    >

                        <div class="archive-thumbnail">

                            <img
                                src="/assets/images/archive/thumb/yori.jpg"
                                alt="요리조리 웹 홈페이지 썸네일"
                            >

                        </div>

                    </button>


                    <div class="archive-card-info">

                        <span>WEB DESIGN</span>

                        <h3>요리조리</h3>

                    </div>

                </article>



<!-- =====================
     딸기우유 마시멜로우
====================== -->
<article class="archive-card">

    <button
        class="archive-card-button"
        type="button"
        data-image="/assets/images/archive/full/marshmallow-preview.jpg"
data-image2="/assets/images/archive/full/marshmallow-preview03.jpg"
        data-title="딸기우유 마시멜로우"
        data-type="상세페이지 디자인"
        data-description="딸기우유 마시멜로우 상품을 위한 상세페이지와 캐릭터 그래픽을 디자인한 프로젝트입니다."
    >
        <div class="archive-thumbnail">
            <img
                src="/assets/images/archive/thumb/unicon.jpg"
                alt="딸기우유 마시멜로우 썸네일"
            >
        </div>
    </button>

    <div class="archive-card-info">
        <span>상세페이지 디자인</span>
        <h3>딸기우유 마시멜로우</h3>
    </div>

</article>

            </div>

        </section>

    </main>


    <!-- =====================
         IMAGE MODAL
    ====================== -->

    <div
        class="archive-modal"
        id="archiveModal"
        aria-hidden="true"
    >

        <button
            class="archive-modal-close"
            id="archiveModalClose"
            type="button"
            aria-label="닫기"
        >
            ×
        </button>


        <div class="archive-modal-inner">

            <img
                id="archiveModalImage"
                src=""
                alt=""
            >

            <img
    id="archiveModalImage2"
    src=""
    alt=""
>


            <div class="archive-modal-info">

                <span id="archiveModalType"></span>

                <h2 id="archiveModalTitle"></h2>

                <p id="archiveModalDescription"></p>

                <a
                    id="archiveModalLink"
                    class="archive-modal-link"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    사이트 이동 →
                </a>

            </div>

        </div>

    </div>


    <!-- =====================
         JS
    ====================== -->

    <!-- 아래 부분 건들지 말기 -->

    <script src="/assets/js/header.js"></script>
    <script src="/assets/js/archive.js"></script>

</body>

</html>

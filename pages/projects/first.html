<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>first penggin | Limitless Spectrum</title>

    <link rel="stylesheet" href="/assets/css/common.css">
    <link rel="stylesheet" href="/assets/css/projects/detail.css">
</head>

<body>

    <!-- Back Navigation -->
    <nav class="detail-nav">
        <a href="../work.html" class="back-btn">
            ← Back
        </a>
    </nav>

    <main class="detail-page">

        <div class="detail-content">

            <!-- Project Header -->
            <header class="project-header">

                <h1 class="project-title">
                    퍼스트 펭귄 상세페이지 디자인
                </h1>

                <div class="title-line"></div>

            </header>

            <!-- Hero -->
            <section class="hero">

                <img
                    class="hero-image"
                    src="/assets/images/work/first_detail_hero.png"
                    alt="콜로소 히어로 배너">

            </section>

            <!-- 프로젝트 소개 -->
            <section class="detail-block project-summary">

                <h2 class="block-title">
                    프로젝트 소개
                </h2>

                <p class="block-text">
                    기존 익스트림 퍼스트 펭귄의 제품 정보와 브랜드 이미지를 바탕으로 상세페이지와 SNS 콘텐츠를 리디자인했습니다.
                    <br>
퍼스트 펭귄이 가진 ‘도전을 포기하지 않는 힘’이라는 메시지를 중심으로 강렬한 블랙 & 옐로우 비주얼을 구성하고, 제품의 특징과 정보를 직관적으로 전달할 수 있도록 콘텐츠를 재구성했습니다.
<br>
상세페이지와 SNS 카드가 하나의 브랜드 이미지로 이어지도록 시각적 요소와 메시지의 통일감을 함께 고려했습니다.
                    <br>
                    

                </p>

            </section>

            <!-- 실제 디자인 작업물 -->
            <section class="detail-block project-showcase">
                <h2 class="block-title">
                    실제 디자인 작업물
                </h2>

                <img
                class="detail-image work-image"
                src="/assets/images/work/first_main_image"
                alt="퍼스트펭귄 실제 디자인 작업물 미리보기">
            
            </section>

            <!-- 프로세스 디자인 -->
            <section class="detail-block process-design">
                <h2 class="block-title">
                    SNS 카드 디자인
                </h2>

                <div class="work-image-wrap">
                    <img
                    class="detail-image"
                    src="/assets/images/work/first_sns_image"
                    alt="퍼스트펭귄 카드 디자인 이미지">

                </div>
            </section>


        </div>

    </main>
    <!-- 이미지 미리보기 기능 추가 -->
     <!-- Image Modal -->
<div class="image-modal" id="imageModal">

    <button class="image-modal-close" id="imageModalClose">
        ×
    </button>

    <div class="image-modal-content">
        <img
            id="modalImage"
            src="/assets/images/work/coloso-main-01.png"
            alt="확대된 디자인 작업물"
        >
    </div>

</div>

    <!-- Top Button -->
    <button class="top-btn">
        TOP
    </button>

    <script src="/assets/js/header.js"></script>
